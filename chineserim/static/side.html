<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>凡人修仙傳・卷軸版</title>
<style>
body{margin:0;background:#0d1015;color:#e6e2d3;font-family:sans-serif;user-select:none}
#top{display:flex;gap:16px;align-items:center;padding:6px 12px;background:#161a21;font-size:14px;flex-wrap:wrap}
#top b{color:#e6b45a}.bar{width:140px;height:10px;background:#333;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%}
#stage{position:relative;width:min(100vw,960px);margin:0 auto}
canvas{display:block;width:100%;background:#000}
#toast{position:absolute;left:0;right:0;top:12px;text-align:center;pointer-events:none;font-size:16px;text-shadow:0 1px 3px #000}
#prompt{position:absolute;left:0;right:0;bottom:70px;text-align:center;pointer-events:none;font-size:18px;color:#ffd97a;text-shadow:0 1px 3px #000}
#quest{position:absolute;right:8px;top:8px;background:#000a;border:1px solid #543;border-radius:6px;padding:6px 10px;font-size:13px;max-width:300px}
#help{position:absolute;left:8px;bottom:8px;font-size:12px;color:#bbb;text-shadow:0 1px 2px #000}
#bar2{max-width:960px;margin:6px auto;padding:0 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{padding:6px 12px;font-size:14px}a{color:#9bd}
#dlg,#trv{display:none;position:absolute;left:0;right:0;bottom:0;background:#1d222aef;border-top:2px solid #b8893a;padding:14px 20px;z-index:9}
#trv{top:0;bottom:auto;border-top:0;border-bottom:2px solid #b8893a}
#dlg .sp{color:#e6b45a;font-weight:bold;margin-bottom:4px}#dlg .tx{font-size:17px;line-height:1.6;margin-bottom:8px}#dlg button,#trv button{display:block;margin:4px 0;font-size:15px;text-align:left}
#err{display:none;background:#7a1f1f;padding:6px 10px}
#logp{max-width:960px;margin:0 auto;padding:4px 12px;font-size:13px;color:#aaa;min-height:60px}
</style>
<div id=err></div>
<div id=top></div>
<div id=stage><canvas id=c width=960 height=540></canvas><div id=toast></div><div id=prompt></div><div id=quest></div>
<div id=help>A/D 移動　W/空白 跳　M 快速移動　J 劍氣　K 法術　Q 換五行　E 互動　F 御器飛行(築基後)</div>
<div id=dlg></div><div id=trv></div></div>
<div id=bar2><button onclick="act('break')">突破</button><button onclick="act('refine')">祭煉青竹蜂雲劍</button><button onclick="act('rest')">閉關7日</button>
<button onclick="if(confirm('重開新局？（覆蓋存檔）'))act('new')">新遊戲</button><a href="/map">舊版地圖頁</a><small>自動存檔</small></div>
<div id=logp></div>
<script>
const $=id=>document.getElementById(id), cv=$('c'), g=cv.getContext('2d'), W=960, H=540, GY=430, SP=700, X0=900;
const ECOL={"金":"#e0e0e0","木":"#6c6","水":"#48c","火":"#e64","土":"#ca6","雷":"#dd4","冰":"#8ef","風":"#9d9"};
const ALL=Object.keys(ECOL), BEASTS=["青狼","毒蛛","鐵背熊","赤焰蛇","碧水蟒","山魈","血翼蝠"];
let S=null, layoutRegion=null, locs=[], plats=[], beasts=[], shots=[], fx=[], unlocked={}, cam=0, worldLen=3000, busy=false, toastT=0, lastLog='', spellIdx=0;
const hero={x:300,y:GY,vx:0,vy:0,face:1,hp:100,maxhp:100,inv:0,atk:0,spl:0,fly:false,ground:true,slash:0};
const keys={};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(!keys[e.key]){keys[e.key]=1;onPress(e.key.toLowerCase())}});
addEventListener('keyup',e=>keys[e.key]=0);
addEventListener('error',e=>{$('err').style.display='block';$('err').textContent='頁面錯誤：'+e.message});
const down=(...k)=>k.some(x=>keys[x]||keys[x.toUpperCase()]);
function rnd(a){a=Math.sin(a*127.1)*43758.5453;return a-Math.floor(a)}
function parentEl(e){return S.elem.parent[e]||e}
function mult(a,b){const A=parentEl(a),B=parentEl(b),P=S.elem.pairs;
 if(P.some(p=>p[0]==A&&p[1]==B))return S.elem.adv; if(P.some(p=>p[0]==B&&p[1]==A))return S.elem.dis; return 1}
function toast(t,ms=2600){$('toast').textContent=t;toastT=ms}
function busyDlg(){return S&&S.dialogue}
async function post(path,params={}){
  const q=new URLSearchParams(Object.assign({hp:Math.round(hero.hp)},params));
  await fetch('/'+path+'?'+q,{method:'POST'}); await load()}
function act(c){post('act',{c})}
async function load(){
  try{S=await (await fetch('/state')).json();$('err').style.display='none'}catch(e){$('err').style.display='block';$('err').textContent='連不上伺服器：'+e;return}
  hero.maxhp=S.max_hp;hero.hp=S.hp;
  if(S.region!==layoutRegion)build();
  const last=S.log[S.log.length-1]||'';if(last!==lastLog){lastLog=last;toast(last)}
  ui()}
function build(){
  layoutRegion=S.region;unlocked={};shots=[];fx=[];
  locs=S.locations.map((l,i)=>Object.assign({},l,{wx:X0+i*SP}));
  worldLen=X0+locs.length*SP+400;
  plats=[];for(let i=0;i<locs.length*3+2;i++){const x=500+i*(SP/3)+rnd(i)*120;plats.push({x,w:120+rnd(i+9)*80,y:GY-95-Math.floor(rnd(i+3)*3)*55})}
  beasts=[];
  locs.forEach(l=>{if(l.wild||l.deep){const n=l.deep?2:3;for(let k=0;k<n;k++)beasts.push(spawn(l,k))}});
  hero.x=300;hero.y=GY;hero.vx=hero.vy=0;hero.fly=false;cam=0}
function spawn(l,k){const scale=1+S.realm_index*(l.deep?1.6:1);const el=ALL[Math.floor(Math.random()*ALL.length)];
  const hp=60*scale*(l.deep?2:1);return{zone:l.id,deep:l.deep,x:l.wx-300+k*300+Math.random()*100,y:GY,hp,maxhp:hp,el,name:BEASTS[Math.floor(Math.random()*BEASTS.length)],dir:Math.random()<.5?-1:1,home:l.wx,hit:0,dead:0,scale,w:l.deep?56:40,h:l.deep?44:30,k}}
function ui(){
  const q=S.quest.quests.find(x=>x.state=='active');
  $('quest').innerHTML=q?`<b>▶ ${q.name}</b>`+q.objectives.filter(o=>o.state!='locked').map(o=>`<div>${o.state=='done'?'☑':'☐'} ${o.text}${o.progress&&o.state=='active'?' <small>('+o.progress+')</small>':''}</div>`).join(''):(S.quest.done?'全部任務完成':'');
  $('top').innerHTML=`<b>${S.name}</b><span>${S.realm}·${S.sub}</span><span>Lv ${S.level}/${S.cap}${S.bottleneck?' <b style=color:#e6a>【瓶頸→按突破】</b>':''}</span>
  <span>HP <span class=bar><i style="width:${100*S.hp/S.max_hp}%;background:#c44"></i></span> ${S.hp}/${S.max_hp}</span><span>靈石 ${S.lingshi}　丹 ${S.pills}　靈液 ${S.lingye}</span><span>第 ${S.day} 日・${S.region_name}</span><span>法術 <b style="color:${ECOL[S.elements[spellIdx%S.elements.length]]}">${S.elements[spellIdx%S.elements.length]}</b></span>`;
  const d=S.dialogue,dl=$('dlg');dl.style.display=d?'block':'none';
  if(d)dl.innerHTML=`<div class=sp>${d.speaker}</div><div class=tx>${d.text}</div>`+(d.cont?`<button onclick="post('choose')">▶ 繼續</button>`:d.choices.map(c=>`<button onclick="post('choose',{i:${c.i}})">${c.text}</button>`).join(''));
  $('logp').innerHTML=S.log.slice(-4).map(x=>'<div>'+x+'</div>').join('')}
function nearLoc(){let b=null,bd=110;for(const l of locs){const d=Math.abs(l.wx-hero.x);if(d<bd){bd=d;b=l}}return b}
function nearPortal(){return Math.abs(hero.x-200)<90}
function zoneAt(x){let b=null,bd=1e9;for(const l of locs)if(l.wild||l.deep){const d=Math.abs(l.wx-x);if(d<bd){bd=d;b=l}}return b}
function onPress(k){
  if(busyDlg())return;
  if(k=='j')slash(); else if(k=='k')spell(); else if(k=='q'){spellIdx++;ui()}
  else if(k=='f'){if(S.realm_index>=2){hero.fly=!hero.fly;toast(hero.fly?'御器飛行':'落地')}else toast('築基期後才能御器飛行')}
  else if(k=='e')interact();
  else if(k=='m')openLocMenu();
  else if((k==' '||k=='w'||k=='arrowup')&&hero.ground&&!hero.fly){hero.vy=-560;hero.ground=false}}
function interact(){
  if(nearPortal()){openTravel();return}
  const l=nearLoc();if(!l)return;
  if(l.wild){post('visit',{loc:l.id,nofight:1});return}
  if(l.deep){if(S.realm_index>=l.min_realm)unlocked[l.id]=true;post('visit',{loc:l.id,nofight:1});return}
  post('visit',{loc:l.id})}
function tgtLoc(){return S&&S.target&&S.target.loc&&S.target.region===S.region?locs.find(l=>l.id===S.target.loc):null}
function tgtRegionName(){if(!S||!S.target||!S.target.region||S.target.region===S.region)return '';const w=S.world.find(x=>x.id===S.target.region);return w?w.name:''}
function openLocMenu(){const t=$('trv');t.style.display='block';
  t.innerHTML='<b>快速移動・本區域地點</b>'+locs.map(l=>`<button onclick="tp('${l.id}')">${S.target&&S.target.loc===l.id?'★ ':''}${l.name.replace(/（.*/,'')}　<small>${l.type}</small></button>`).join('')+'<button onclick="$(\'trv\').style.display=\'none\'">取消</button>'}
function tp(id){const l=locs.find(x=>x.id===id);$('trv').style.display='none';if(l){hero.x=l.wx-90;hero.y=GY;hero.vy=0;hero.face=1}}
function openTravel(){const t=$('trv');t.style.display='block';
  t.innerHTML='<b>傳送陣・選擇目的地</b>'+S.world.filter(w=>w.id!=S.region).map(w=>`<button ${w.locked?'disabled':''} onclick="go('${w.id}')">${S.target&&S.target.region===w.id?'★ ':''}${w.name}（${w.days} 日）${w.locked?' 🔒 需化神飛升':''}</button>`).join('')+'<button onclick="$(\'trv\').style.display=\'none\'">取消</button>'}
async function go(id){$('trv').style.display='none';await post('travel',{to:id})}
function dmgBase(){return 18*(1+S.realm_index*1.5)}
function slash(){if(hero.atk>0)return;hero.atk=.35;hero.slash=.18;
  const x0=hero.face>0?hero.x:hero.x-90,x1=x0+90;
  for(const b of beasts)if(!b.dead&&b.x+b.w/2>x0&&b.x-b.w/2<x1&&Math.abs(b.y-hero.y)<70)hit(b,dmgBase(),'')}
function spell(){if(hero.spl>0)return;hero.spl=.6;const el=S.elements[spellIdx%S.elements.length];
  shots.push({x:hero.x+hero.face*30,y:hero.y-40,vx:hero.face*520,el,life:1.4,dmg:dmgBase()*.9})}
function hit(b,base,el){const m=el?mult(el,b.el):1;const d=base*m;b.hp-=d;b.hit=.15;b.x+=hero.face*10;
  fx.push({x:b.x,y:b.y-b.h-10,t:.8,txt:Math.round(d)+(m>1?' ↑':m<1?' ↓':''),c:m>1?'#ff8':m<1?'#88f':'#fff'});
  if(b.hp<=0&&!b.dead){b.dead=1;b.respawn=12;post('kill',{loc:b.zone,deep:b.deep?1:0})}}
function update(dt){
  if(!S)return;const frozen=busyDlg()||$('trv').style.display=='block';
  toastT-=dt*1000;if(toastT<0)$('toast').textContent='';
  if(frozen)return;
  hero.atk-=dt;hero.spl-=dt;hero.inv-=dt;hero.slash-=dt;
  const mx=(down('d','arrowright')?1:0)-(down('a','arrowleft')?1:0);
  const sp=hero.fly?330:240;hero.vx=mx*sp;if(mx)hero.face=mx;
  hero.x=Math.max(60,Math.min(worldLen-60,hero.x+hero.vx*dt));
  if(hero.fly){const my=(down('s','arrowdown')?1:0)-(down('w','arrowup',' ')?1:0);hero.y=Math.max(90,Math.min(GY,hero.y+my*300*dt));hero.vy=0;hero.ground=hero.y>=GY}
  else{const py=hero.y;hero.vy+=1500*dt;hero.y+=hero.vy*dt;hero.ground=false;
    if(hero.y>=GY){hero.y=GY;hero.vy=0;hero.ground=true}
    else if(hero.vy>0)for(const p of plats)if(hero.x>p.x&&hero.x<p.x+p.w&&py<=p.y&&hero.y>=p.y){hero.y=p.y;hero.vy=0;hero.ground=true}}
  for(const s of shots){s.x+=s.vx*dt;s.life-=dt;for(const b of beasts)if(!b.dead&&s.life>0&&Math.abs(s.x-b.x)<b.w/2+8&&Math.abs(s.y-(b.y-b.h/2))<b.h){hit(b,s.dmg,s.el);s.life=0}}
  shots=shots.filter(s=>s.life>0);
  for(const b of beasts){
    if(b.dead){b.respawn-=dt;if(b.respawn<=0){Object.assign(b,spawn(locs.find(l=>l.id==b.zone),b.k))}continue}
    b.hit-=dt;const dx=hero.x-b.x;
    if(Math.abs(dx)<380&&Math.abs(hero.y-b.y)<160){b.dir=Math.sign(dx)||1;b.x+=b.dir*(b.deep?95:75)*dt}
    else{b.x+=b.dir*40*dt;if(Math.abs(b.x-b.home)>420)b.dir*=-1}
    if(hero.inv<=0&&Math.abs(dx)<b.w/2+14&&hero.y>b.y-b.h-40&&hero.y-b.y<20){
      const inc=mult(b.el,S.elements[0]);hero.hp-=12*b.scale*(b.deep?1.5:1)*inc*.7;hero.inv=1;
      fx.push({x:hero.x,y:hero.y-70,t:.8,txt:'-'+Math.round(12*b.scale*inc*.7),c:'#f66'});
      if(hero.hp<=0){hero.hp=1;post('die');hero.x=300;hero.y=GY;beasts.forEach(k=>{if(!k.dead)k.hit=0})}}}
  for(const f of fx){f.t-=dt;f.y-=30*dt}fx=fx.filter(f=>f.t>0);
  cam=Math.max(0,Math.min(worldLen-W,hero.x-W/2));
  const l=nearLoc();$('prompt').textContent=nearPortal()?'E：傳送陣（前往其他區域）':l?(l.wild?`E：探查 ${l.name.replace(/（.*/,'')}`:`E：進入 ${l.name.replace(/（.*/,'')}${l.deep&&S.realm_index<l.min_realm?'（境界不足）':''}`):'';
}
function tree(x,y,s,c){g.fillStyle='#3b2a1a';g.fillRect(x-4*s,y-40*s,8*s,40*s);g.fillStyle=c;g.beginPath();g.arc(x,y-56*s,26*s,0,7);g.fill()}
function draw(){
  if(!S)return;g.clearRect(0,0,W,H);
  const hue=[...S.region].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
  const sky=g.createLinearGradient(0,0,0,GY);sky.addColorStop(0,`hsl(${hue},45%,18%)`);sky.addColorStop(1,`hsl(${hue},40%,42%)`);g.fillStyle=sky;g.fillRect(0,0,W,H);
  g.fillStyle='#ffffffcc';g.beginPath();g.arc(760-cam*.02,90,26,0,7);g.fill();
  for(const [f,c,a,hh] of [[.15,`hsl(${hue},30%,26%)`,.004,150],[.4,`hsl(${hue},28%,20%)`,.007,90]]){g.fillStyle=c;g.beginPath();g.moveTo(0,GY);
    for(let x=0;x<=W;x+=20){const wx=x+cam*f;g.lineTo(x,GY-hh*(.5+.5*Math.sin(wx*a)*Math.sin(wx*a*2.3+1)))}g.lineTo(W,GY);g.fill()}
  g.fillStyle=`hsl(${hue},25%,14%)`;g.fillRect(0,GY,W,H-GY);g.fillStyle=`hsl(${hue},35%,24%)`;g.fillRect(0,GY,W,6);
  g.save();g.translate(-cam,0);
  for(const p of plats){if(p.x+p.w<cam||p.x>cam+W)continue;g.fillStyle='#5a4a38';g.fillRect(p.x,p.y,p.w,10);g.fillStyle='#7c9a58';g.fillRect(p.x,p.y,p.w,4)}
  // 傳送陣
  g.strokeStyle='#8cf';g.lineWidth=3;g.beginPath();g.ellipse(200,GY,46,12,0,0,7);g.stroke();g.fillStyle='#8cf3';g.fill();g.fillStyle='#cfe';g.font='14px sans-serif';g.textAlign='center';g.fillText('傳送陣',200,GY-70);
  for(const l of locs){const x=l.wx;if(x<cam-200||x>cam+W+200)continue;
    g.textAlign='center';
    if(l.wild){for(let i=-3;i<=3;i++)tree(x+i*70+(rnd(i+x)*20),GY,.7+rnd(i)*.6,'#2c5a34')}
    else if(l.deep){g.fillStyle='#181020';g.beginPath();g.moveTo(x-80,GY);g.quadraticCurveTo(x,GY-200,x+80,GY);g.fill();g.fillStyle=unlocked[l.id]?'#d4d':'#a3a';g.globalAlpha=.6;g.beginPath();g.ellipse(x,GY-40,34,50,0,0,7);g.fill();g.globalAlpha=1}
    else if(/門派/.test(l.type)){for(let i=0;i<3;i++){g.fillStyle='#8a3a2a';g.fillRect(x-40+i*4,GY-50-i*40,80-i*8,36);g.fillStyle='#d9a441';g.beginPath();g.moveTo(x-52+i*8,GY-50-i*40);g.lineTo(x,GY-78-i*40);g.lineTo(x+52-i*8,GY-50-i*40);g.fill()}g.fillStyle='#4a2a1a';g.fillRect(x-40,GY-50,80,50)}
    else{for(let i=-1;i<=1;i++){g.fillStyle='#c9b48a';g.fillRect(x+i*70-28,GY-52,56,52);g.fillStyle='#7a3a2a';g.beginPath();g.moveTo(x+i*70-36,GY-52);g.lineTo(x+i*70,GY-84);g.lineTo(x+i*70+36,GY-52);g.fill();g.fillStyle='#432';g.fillRect(x+i*70-7,GY-30,14,30)}}
    g.font='bold 18px sans-serif';g.fillStyle='#000a';g.fillText(l.name.replace(/（.*/,''),x+1,GY-166+1);g.fillStyle=l.wild?'#f99':l.deep?'#e9f':'#ffe9a6';g.fillText(l.name.replace(/（.*/,''),x,GY-166);
    g.font='12px sans-serif';g.fillStyle='#ccc';g.fillText(l.type+(l.wild?'・妖獸出沒':''),x,GY-148)}
  for(const b of beasts){if(b.dead)continue;g.fillStyle=b.hit>0?'#fff':ECOL[b.el];g.beginPath();g.ellipse(b.x,b.y-b.h/2,b.w/2,b.h/2,0,0,7);g.fill();
    g.fillStyle='#000';g.fillRect(b.x+b.dir*b.w/5-3,b.y-b.h/2-6,5,5);g.fillStyle='#222';g.fillRect(b.x-22,b.y-b.h-14,44,5);g.fillStyle='#e44';g.fillRect(b.x-22,b.y-b.h-14,44*Math.max(0,b.hp/b.maxhp),5);
    g.fillStyle=ECOL[b.el];g.font='12px sans-serif';g.textAlign='center';g.fillText(b.el+b.name,b.x,b.y-b.h-18)}
  for(const s of shots){g.fillStyle=ECOL[s.el];g.beginPath();g.arc(s.x,s.y,9,0,7);g.fill();g.fillStyle='#fff8';g.beginPath();g.arc(s.x,s.y,4,0,7);g.fill()}
  // 主角
  if(hero.inv<=0||Math.floor(hero.inv*12)%2==0){const x=hero.x,y=hero.y;
    if(hero.fly){g.strokeStyle='#9df';g.lineWidth=5;g.beginPath();g.moveTo(x-26,y+2);g.lineTo(x+26,y+2);g.stroke()}
    g.fillStyle='#cfd8e8';g.fillRect(x-11,y-52,22,44);g.fillStyle='#345';g.fillRect(x-11,y-30,22,6);g.fillStyle='#f0d2b0';g.beginPath();g.arc(x,y-62,11,0,7);g.fill();g.fillStyle='#222';g.fillRect(x-11,y-74,22,8);
    g.fillStyle='#222';g.fillRect(x-9,y-8,7,8);g.fillRect(x+2,y-8,7,8)}
  if(hero.slash>0){g.strokeStyle='#bfe8ff';g.lineWidth=6;g.beginPath();g.arc(hero.x+hero.face*30,hero.y-40,56,hero.face>0?-1.1:Math.PI-1.1+.0,hero.face>0?1.1:Math.PI+1.1);g.stroke()}
  const tl=tgtLoc(),bob=Math.sin(performance.now()/250)*6;
  if(tl){g.fillStyle='#ffd24a';g.font='bold 26px sans-serif';g.textAlign='center';g.fillText('▼',tl.wx,GY-190+bob);g.font='bold 13px sans-serif';g.fillText('目標',tl.wx,GY-208+bob)}
  else if(tgtRegionName()){g.fillStyle='#ffd24a';g.font='bold 26px sans-serif';g.textAlign='center';g.fillText('▼',200,GY-100+bob)}
  for(const f of fx){g.fillStyle=f.c;g.font='bold 16px sans-serif';g.textAlign='center';g.fillText(f.txt,f.x,f.y)}
  g.restore();
  if(tl){const sx=tl.wx-cam;if(sx<40||sx>W-40){g.fillStyle='#ffd24a';g.font='bold 18px sans-serif';g.textAlign=sx<40?'left':'right';g.fillText((sx<40?'◀ ':'')+'目標 '+Math.round(Math.abs(tl.wx-hero.x)/100)*100+'m'+(sx<40?'':' ▶'),sx<40?8:W-8,GY-120)}}
  else if(tgtRegionName()){g.fillStyle='#ffd24a';g.font='bold 15px sans-serif';g.textAlign='center';g.fillText('目標在「'+tgtRegionName()+'」：到傳送陣(E)前往',W/2,60)}}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;try{update(dt);draw()}catch(e){$('err').style.display='block';$('err').textContent='執行錯誤：'+e.message}requestAnimationFrame(loop)}
window.__game={hero,get S(){return S},get beasts(){return beasts},get locs(){return locs},post,load};
load().then(()=>requestAnimationFrame(loop));
</script>
